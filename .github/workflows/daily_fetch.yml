Yes, absolutely possible! Here's the full picture of how to automate this with Torn's API and GitHub Actions.

What the Torn API can give you

Torn's API is a read-only system — you call it with a 16-character API key and it returns live data about your player, faction, or company. For faction tracking specifically, the key endpoints are:

faction/?selections=contributors&stat=attackswon — lists all contributors to a given stat; requires Limited access and faction API access enabled on your account's position.
faction/?selections=attacks — returns individual attack logs with respect earned per hit
faction/?selections=stats — shows cumulative faction stats including attackswon, attackslost, hosps, organisedcrimerespect, territoryrespect, and more; requires Minimal access + faction API access.
faction/?selections=basic — member list with IDs and names
So respect earned per member per day is tracked via the attacks log — each attack record includes the attacker's ID and the respect gained. You pull the last 24 hours of attacks each day, group by member, and that's your daily breakdown.

Step-by-step setup

Step 1 — Get your API key

Go to torn.com → Settings → API Key. You need Limited Access at minimum, and your faction position must have Faction API permission enabled (ask your leader if needed).

Step 2 — Create your GitHub repo

Create a new repo, e.g. torn-faction-tracker. Add two folders: data/ (where JSON snapshots will live) and .github/workflows/.

Step 3 — Store your API key as a GitHub Secret

In your repo → Settings → Secrets and variables → Actions → New repository secret. Name it TORN_API_KEY. Paste your key. This keeps it out of your code.

Step 4 — Write the fetch script

Create fetch_stats.js (Node.js) in the repo root:

js
const fs = require('fs');

const API_KEY = process.env.TORN_API_KEY;
const BASE = 'https://api.torn.com';

async function fetchJSON(url) {
  const res = await fetch(url);
  return res.json();
}

async function run() {
  const today = new Date().toISOString().slice(0, 10);

  // Get faction member list
  const basic = await fetchJSON(`${BASE}/faction/?selections=basic&key=${API_KEY}`);

  // Get attacks from last 24 hours
  const fromTimestamp = Math.floor(Date.now() / 1000) - 86400;
  const attacks = await fetchJSON(
    `${BASE}/faction/?selections=attacks&from=${fromTimestamp}&key=${API_KEY}`
  );

  // Tally per member
  const members = {};
  for (const [id, m] of Object.entries(basic.members || {})) {
    members[id] = { name: m.name, respect: 0, hits: 0, assists: 0, losses: 0 };
  }

  for (const atk of Object.values(attacks.attacks || {})) {
    const id = String(atk.attacker_id);
    if (!members[id]) members[id] = { name: atk.attacker_name, respect: 0, hits: 0, assists: 0, losses: 0 };
    if (atk.result === 'Hospitalize' || atk.result === 'Mug' || atk.result === 'Leave') {
      members[id].hits++;
      members[id].respect += atk.respect_gain || 0;
    } else if (atk.result === 'Assist') {
      members[id].assists++;
    } else if (atk.result === 'Lost' || atk.result === 'Stalemate') {
      members[id].losses++;
    }
  }

  const snapshot = { date: today, members: Object.entries(members).map(([id, m]) => ({ id, ...m })) };

  fs.mkdirSync('data', { recursive: true });
  fs.writeFileSync(`data/${today}.json`, JSON.stringify(snapshot, null, 2));
  console.log(`Saved data/${today}.json`);
}

run();
Step 5 — Create the GitHub Actions workflow

Create .github/workflows/daily_fetch.yml:

yaml
name: Daily Faction Stats

on:
  schedule:
    - cron: '0 0 * * *'   # runs at midnight UTC every day
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Torn stats
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        run: node fetch_stats.js

      - name: Commit and push data
        run: |
          git config user.name "torn-bot"
          git config user.email "bot@torn"
          git add data/
          git commit -m "stats: $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
Step 6 — Enable Actions write permissions

In your repo → Settings → Actions → General → Workflow permissions → set to Read and write.

What you'll end up with

Every day at midnight UTC, GitHub Actions will automatically call the Torn API, calculate each member's respect earned, hits, assists, and losses for that day, save it as data/2026-06-01.json, and commit it to your repo — zero manual effort. You can then point the dashboard from earlier at those JSON files, or query the data/ folder to build leaderboards over time.


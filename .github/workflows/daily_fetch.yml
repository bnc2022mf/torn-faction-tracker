Let me try a different approach to fix this. Edit your .github/workflows/daily_fetch.yml and replace the entire file with this — it uses a more robust push method:

yaml
name: Daily Faction Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      backfill_from:
        description: 'Backfill from date (YYYY-MM-DD) — leave empty for normal run'
        required: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Torn stats
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
        run: node fetch_stats.js

      - name: Commit and push data
        run: |
          git config user.name "torn-bot"
          git config user.email "bot@torn"
          git add data/
          git diff --staged --quiet || git commit -m "stats: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
